<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página Não Encontrada | MONARCH SOUND</title>

    <meta
      name="description"
      content="A página que você procura não foi encontrada. Retorne para a MONARCH SOUND."
    />

    <link rel="icon" href="assets/icons/favicon/favicon-primary.png" />

    <style>
      :root {
        --bg: #1a1a1a;
        --bg-secondary: #232323;

        --off-white: #f3eee7;
        --beige: #e7ded2;
        --beige-strong: #d5c9b8;

        --accent: #c65d3a;

        --font-heading: "Space Grotesk", sans-serif;
        --font-body: "Inter", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
          linear-gradient(rgba(26, 26, 26, 0.92), rgba(26, 26, 26, 0.96)),
          url("assets/backgrounds/monarch-hero-bg.webp") center/cover no-repeat;

        color: var(--off-white);

        font-family: var(--font-body);

        overflow: hidden;
      }

      body::before {
        content: "";

        position: absolute;
        inset: 0;

        background: url("assets/textures/noise-premium.webp") center/350px
          repeat;

        opacity: 0.08;

        pointer-events: none;
      }

      .error-container {
        position: relative;

        width: min(90%, 900px);

        text-align: center;

        z-index: 2;
      }

      .error-code {
        font-family: var(--font-heading);

        font-size: clamp(6rem, 16vw, 14rem);

        line-height: 0.85;

        letter-spacing: -0.08em;

        color: var(--off-white);

        margin-bottom: 1rem;
      }

      .error-label {
        display: inline-block;

        margin-bottom: 1.5rem;

        color: var(--accent);

        font-size: 0.85rem;

        font-weight: 700;

        letter-spacing: 0.18em;

        text-transform: uppercase;
      }

      h1 {
        font-family: var(--font-heading);

        font-size: clamp(2.5rem, 5vw, 5rem);

        line-height: 0.95;

        letter-spacing: -0.05em;

        margin-bottom: 1.5rem;
      }

      p {
        max-width: 650px;

        margin: 0 auto 2.5rem;

        color: var(--beige-strong);

        line-height: 1.8;

        font-size: 1.05rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-height: 56px;

        padding: 0 32px;

        border: 1px solid var(--accent);

        background: var(--accent);

        color: var(--off-white);

        text-decoration: none;

        font-size: 0.78rem;
        font-weight: 700;

        letter-spacing: 0.15em;

        text-transform: uppercase;

        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn:hover {
        background: transparent;

        color: var(--accent);

        transform: translateY(-2px);
      }

      .signature {
        margin-top: 3rem;

        color: rgba(243, 238, 231, 0.55);

        font-size: 0.75rem;

        letter-spacing: 0.08em;
      }
    </style>
  </head>

  <body>
    <main class="error-container">
      <span class="error-label"> Erro 404 </span>

      <div class="error-code">404</div>

      <h1>Página Não Encontrada</h1>

      <p>
        O conteúdo que você está procurando não está disponível ou foi movido
        para outro endereço. Retorne para a página principal da MONARCH SOUND e
        continue explorando nosso universo criativo.
      </p>

      <a href="/" class="btn"> Voltar ao Início </a>

      <div class="signature">Projeto desenvolvido por Segundo Almeida</div>
    </main>
  </body>
</html>
